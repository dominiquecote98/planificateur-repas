<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes repas</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">

<style>

:root{
--primary:#0f766e;
--background:#f5f7fa;
--card:#ffffff;
--text:#222;
}

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:var(--background);
color:var(--text);
}

header{
background:var(--primary);
color:white;
padding:18px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.tabs{
display:flex;
background:white;
position:sticky;
top:0;
z-index:100;
}

.tab{
flex:1;
padding:12px;
border:none;
background:white;
font-size:16px;
font-weight:600;
}

.tab.active{
background:var(--primary);
color:white;
}

.section{
display:none;
padding:15px;
}

.section.active{
display:block;
}

.card{
background:var(--card);
padding:15px;
border-radius:12px;
margin-bottom:15px;
box-shadow:0 2px 6px rgba(0,0,0,.08);
}

input,
textarea,
select{
width:100%;
padding:10px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
background:var(--primary);
color:white;
border:none;
padding:10px;
border-radius:8px;
font-size:15px;
}

.recipe{
margin-top:8px;
padding:10px;
border:1px solid #ddd;
border-radius:10px;
}

.recipe-title{
font-weight:bold;
margin-bottom:5px;
}

.delete-btn{
background:#dc2626;
margin-top:8px;
}

.day{
margin-bottom:20px;
padding-bottom:10px;
border-bottom:1px solid #eee;
}

.check{
margin-bottom:8px;
}

ul{
padding-left:20px;
}

small{
color:#666;
}

</style>
</head>

<body>

<header>
🍽️ Planificateur de repas
</header>

<div class="tabs">
<button class="tab active" data-tab="recipes">Repas</button>
<button class="tab" data-tab="week">Semaine</button>
<button class="tab" data-tab="grocery">Épicerie</button>
</div>

<section id="recipes" class="section active">

<div class="card">

<h3>Ajouter une recette</h3>

<input
id="recipeName"
placeholder="Nom de la recette">

<textarea
id="recipeIngredients"
rows="4"
placeholder="Ingrédients séparés par des virgules"></textarea>

<button onclick="addRecipe()">
Ajouter
</button>

</div>

<div class="card">

<h3>Mes recettes</h3>

<div id="recipeList"></div>

</div>

</section>

<section id="week" class="section">

<div class="card">

<h3>Planification hebdomadaire</h3>

<div id="planner"></div>

</div>

</section>

<section id="grocery" class="section">

<div class="card">

<h3>Déjà dans le frigo ou garde-manger</h3>

<div id="inventory"></div>

</div>

<div class="card">

<h3>Liste d'épicerie</h3>

<div id="groceryList"></div>

</div>

</section>

<script>

const DAYS = [
"Lundi",
"Mardi",
"Mercredi",
"Jeudi",
"Vendredi",
"Samedi",
"Dimanche"
];

let recipes =
JSON.parse(localStorage.getItem("recipes")) || [];

let plan =
JSON.parse(localStorage.getItem("plan")) || {};

let pantry =
JSON.parse(localStorage.getItem("pantry")) || [];

function save(){

localStorage.setItem(
"recipes",
JSON.stringify(recipes)
);

localStorage.setItem(
"plan",
JSON.stringify(plan)
);

localStorage.setItem(
"pantry",
JSON.stringify(pantry)
);

}

document.querySelectorAll(".tab")
.forEach(tab=>{

tab.addEventListener("click",()=>{

document
.querySelectorAll(".tab")
.forEach(t=>t.classList.remove("active"));

document
.querySelectorAll(".section")
.forEach(s=>s.classList.remove("active"));

tab.classList.add("active");

document
.getElementById(tab.dataset.tab)
.classList.add("active");

});

});

function addRecipe(){

const name =
document
.getElementById("recipeName")
.value
.trim();

const ingredients =
document
.getElementById("recipeIngredients")
.value
.split(",")
.map(i=>i.trim())
.filter(Boolean);

if(!name || ingredients.length===0)
return;

recipes.push({

id:Date.now(),
name,
ingredients

});

save();

document.getElementById("recipeName").value="";
document.getElementById("recipeIngredients").value="";

renderRecipes();
renderPlanner();

}

function deleteRecipe(id){

recipes =
recipes.filter(r=>r.id!==id);

save();

renderRecipes();
renderPlanner();
renderInventory();

}

function renderRecipes(){

const container =
document.getElementById("recipeList");

container.innerHTML="";

recipes.forEach(recipe=>{

container.innerHTML += `
<div class="recipe">

<div class="recipe-title">
${recipe.name}
</div>

<small>
${recipe.ingredients.join(", ")}
</small>

<br>

<button
class="delete-btn"
onclick="deleteRecipe(${recipe.id})">
Supprimer
</button>

</div>
`;

});

}

function buildOptions(selected){

return recipes.map(recipe=>`

<option
value="${recipe.name}"
${selected===recipe.name?"selected":""}>
${recipe.name}
</option>

`).join("");

}

function renderPlanner(){

const div =
document.getElementById("planner");

let html="";

DAYS.forEach(day=>{

html += `

<div class="day">

<strong>${day}</strong>

<br><br>

<label>Dîner</label>

<select
onchange="
updatePlan(
'${day}',
'diner',
this.value
)">

<option value="">
--
</option>

${buildOptions(plan[day]?.diner)}

</select>

<label>Souper</label>

<select
onchange="
updatePlan(
'${day}',
'souper',
this.value
)">

<option value="">
--
</option>

${buildOptions(plan[day]?.souper)}

</select>

</div>

`;

});

div.innerHTML=html;

}

function updatePlan(
day,
type,
value
){

if(!plan[day])
plan[day]={};

plan[day][type]=value;

save();

renderInventory();

}

function mealIngredients(){

const set = new Set();

Object.values(plan)
.forEach(day=>{

Object.values(day)
.forEach(recipeName=>{

const recipe =
recipes.find(
r=>r.name===recipeName
);

if(recipe){

recipe.ingredients
.forEach(i=>set.add(i));

}

});

});

return [...set];

}

function renderInventory(){

const div =
document.getElementById("inventory");

const ingredients =
mealIngredients();

div.innerHTML="";

ingredients.forEach(item=>{

div.innerHTML += `

<div class="check">

<label>

<input
type="checkbox"
${pantry.includes(item)?"checked":""}
onchange="
togglePantry(
'${item}'
)">

${item}

</label>

</div>

`;

});

renderGrocery();

}

function togglePantry(item){

if(pantry.includes(item)){

pantry =
pantry.filter(
i=>i!==item
);

}else{

pantry.push(item);

}

save();

renderInventory();

}

function renderGrocery(){

const div =
document.getElementById("groceryList");

const grocery =
mealIngredients()
.filter(
i=>!pantry.includes(i)
);

if(grocery.length===0){

div.innerHTML =
"✅ Rien à acheter";

return;

}

div.innerHTML =
"<ul>" +
grocery.map(
g=>`<li>${g}</li>`
).join("")
+
"</ul>";

}

renderRecipes();
renderPlanner();
renderInventory();

if ('serviceWorker' in navigator) {

navigator.serviceWorker
.register('sw.js');

}

</script>

</body>
</html>
